[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "color-analysis-tool"
version = "2.0.0"
description = "Image color palette extraction, harmony analysis, and design-token export"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Michail Semoglou" }
]
maintainers = [
    { name = "Michail Semoglou" }
]
keywords = [
    "color",
    "color analysis",
    "image processing",
    "color harmony",
    "design tools",
    "color extraction",
    "RGB",
    "CMYK",
    "HEX",
    "color space",
    "batch processing",
    "dominant color"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Artistic Software",
    "Typing :: Typed"
]

dependencies = [
    "Pillow>=12.3.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "ruff>=0.6.0",
    "build>=0.10.0",
    "twine>=7.0.0",
    "pip-audit>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/MichailSemoglou/color-analysis-tool"
Repository = "https://github.com/MichailSemoglou/color-analysis-tool"
Documentation = "https://github.com/MichailSemoglou/color-analysis-tool#readme"
Issues = "https://github.com/MichailSemoglou/color-analysis-tool/issues"
Changelog = "https://github.com/MichailSemoglou/color-analysis-tool/blob/main/CHANGELOG.md"

[project.scripts]
color-analysis = "color_analysis_tool.cli:main"

[tool.hatch.build.targets.sdist]
include = [
    "/color_analysis_tool",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/MIGRATION.md",
    "/REFERENCES.md",
    "/CITATION.cff"
]

[tool.hatch.build.targets.wheel]
packages = ["color_analysis_tool"]
exclude = ["research/"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff.lint]
# Docstring linting only, matching the house convention (Args/Returns/Raises)
select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests", "color_analysis_tool"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--doctest-modules --cov=color_analysis_tool --cov-branch --cov-report=term-missing --cov-fail-under=100"
